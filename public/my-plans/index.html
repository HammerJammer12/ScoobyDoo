<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Plans</title>
  <style>
    /* Page-only styles until we have a shared stylesheet (#3). */
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fa; color: #1e1e1e; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
    .card h2 { margin: 0 0 12px; font-size: 1.2rem; }
    .muted, .meta { color: #6c757d; font-size: 0.85rem; }
    .meta { text-transform: capitalize; }
    .msg.error { color: #e03131; }
    button, .button { font: inherit; font-size: 0.9rem; padding: 6px 12px; border-radius: 6px; border: 1px solid #adb5bd; background: #e9ecef; color: inherit; cursor: pointer; text-decoration: none; }
    .button.primary { background: #1971c2; border-color: #1971c2; color: #fff; }
    button.danger { background: #e03131; border-color: #e03131; color: #fff; }
    button:disabled { opacity: 0.6; cursor: default; }
    .day { border-top: 1px solid #f1f3f5; padding: 12px 0; }
    .day:first-of-type { border-top: 0; padding-top: 0; }
    .day-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .day-head h3 { margin: 0; font-size: 1rem; flex: 1; }
    .exercises { margin: 6px 0 0; padding-left: 20px; }
    .exercises li { margin: 2px 0; }
    .rx { white-space: nowrap; font-variant-numeric: tabular-nums; color: #495057; }
  </style>
</head>
<body>
<main>
  <p><a href="/">&larr; Home</a></p>
  <h1>My plans</h1>
  <p class="muted">Start a day to log it as a workout. <a href="/plan/">Build a new plan</a></p>
  <p id="status" class="muted" role="status">Loading…</p>
  <div id="plans"></div>
</main>
<script src="myPlans.js"></script>
</body>
</html>
