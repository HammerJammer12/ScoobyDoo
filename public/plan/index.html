<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Build a Plan</title>
  <style>
    /* Page-only styles until we have a shared stylesheet (#3). */
    body { margin: 0; font-family: system-ui, sans-serif; background: #f8f9fa; color: #1e1e1e; }
    main { max-width: 720px; margin: 0 auto; padding: 16px; }
    .card { background: #fff; border: 1px solid #dee2e6; border-radius: 8px; padding: 16px 20px; margin-bottom: 20px; }
    .card h2 { margin: 0 0 12px; font-size: 1.2rem; }
    label { display: block; font-size: 0.9rem; }
    select, input[type="text"] { display: block; width: 100%; box-sizing: border-box; padding: 8px; margin-top: 4px; font: inherit; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
    fieldset { border: 1px solid #dee2e6; border-radius: 6px; margin: 0 0 12px; padding: 8px 12px; }
    legend { font-size: 0.9rem; padding: 0 4px; }
    .check { display: flex; gap: 6px; align-items: center; margin: 4px 0; }
    .checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0 12px; }
    .checks[hidden] { display: none; }
    .hint { color: #6c757d; font-size: 0.85rem; margin: 4px 0 0; }
    .msg { font-size: 0.9rem; margin: 8px 0 0; }
    .msg.error { color: #e03131; }
    .msg.ok { color: #2f9e44; }
    button { font: inherit; padding: 8px 14px; border-radius: 6px; border: 1px solid #adb5bd; background: #e9ecef; cursor: pointer; }
    button.primary { background: #1971c2; border-color: #1971c2; color: #fff; }
    button.small { padding: 4px 10px; font-size: 0.85rem; }
    button:disabled { opacity: 0.6; cursor: default; }
    .day h2 { display: flex; justify-content: space-between; align-items: baseline; }
    .day h2 small { font-weight: normal; color: #6c757d; font-size: 0.85rem; }
    .exercises { list-style: none; margin: 0; padding: 0; }
    .exercise { border-top: 1px solid #f1f3f5; padding: 10px 0; }
    .exercise:first-child { border-top: 0; }
    .row { display: flex; gap: 12px; align-items: center; }
    .row .info { flex: 1; min-width: 0; }
    .name { font-weight: 600; }
    .meta { color: #6c757d; font-size: 0.85rem; text-transform: capitalize; }
    .rx { white-space: nowrap; font-variant-numeric: tabular-nums; }
    .actions { display: flex; gap: 6px; }
    .alts { list-style: none; margin: 8px 0 0; padding: 8px; background: #f1f3f5; border-radius: 6px; }
    .alts li { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 4px 0; }
    .save-row { display: flex; gap: 8px; align-items: flex-end; }
    .save-row label { flex: 1; }
    @media (max-width: 480px) {
      .row { flex-wrap: wrap; }
      .save-row { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body>
<main>
  <p><a href="/">&larr; Home</a></p>
  <h1>Build a plan</h1>

  <section class="card">
    <h2>Your preferences</h2>
    <form id="prefs-form">
      <div class="grid">
        <label>Goal
          <select id="goal">
            <option value="strength">Strength</option>
            <option value="hypertrophy" selected>Build muscle</option>
            <option value="endurance">Endurance</option>
          </select>
        </label>
        <label>Days per week
          <select id="days">
            <option>1</option><option>2</option><option selected>3</option>
            <option>4</option><option>5</option><option>6</option>
          </select>
        </label>
        <label>Minutes per workout
          <select id="minutes">
            <option>30</option><option selected>45</option><option>60</option>
            <option>75</option><option>90</option>
          </select>
        </label>
        <label>Experience
          <select id="level">
            <option value="beginner" selected>Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="expert">Expert</option>
          </select>
        </label>
      </div>

      <fieldset>
        <legend>Equipment</legend>
        <label class="check"><input type="checkbox" id="full-gym" checked> I have a full gym</label>
        <div id="equipment-list" class="checks" hidden></div>
        <p class="hint">Bodyweight exercises are always included.</p>
      </fieldset>

      <button class="primary" type="submit">Generate plan</button>
      <p class="msg" role="status" hidden></p>
    </form>
  </section>

  <div id="plan"></div>
</main>
<script src="planPage.js"></script>
</body>
</html>
